name: SGE Smoke
on: [push]
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d eventos"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eventos?schema=public
      SESSION_SECRET: segredo-de-ci-apenas-para-os-testes-locais-123456
      SEED_PASSWORD: SenhaSeguraDeTeste123!
      INSTITUTIONAL_EMAIL_DOMAIN: instituicao.edu.br
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-smoke
          path: |
            evidencias/
            test-results/
